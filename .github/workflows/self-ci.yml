name: "CI"

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  pr-title:
    name: "Validate PR title"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Validate PR title"
        uses: ./.github/actions/validate-pr-title
        if: github.event_name == 'pull_request'
        with:
          pr-title: ${{ github.event.pull_request.title }}

  pre-commit:
    name: "Run pre-commit hooks"
    # A title edit changes no files, so there is nothing for the hooks to check.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Install mise tools"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0

      - name: "Run pre-commit hooks"
        uses: ./.github/actions/pre-commit
        with:
          working-directory: "."
          all-files: "true"
          # Meaningless in CI, and would fail outright on push-to-main runs,
          # where checkout leaves us on a real `main` branch.
          skip: "no-commit-to-branch"
